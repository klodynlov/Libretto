[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libretto-sms"
version = "0.1.0"
description = "Libretto — Sense of Musical Structure : analyse structurelle symbolique (29 axes) de fichiers MIDI, 100 % stdlib"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "klodynlov" }]
keywords = ["music", "midi", "structure", "analysis", "mir"]

[project.scripts]
libretto = "libretto.cli:main"

[tool.setuptools]
# `libretto._generators` embarque les scripts de `examples/` (Forge, Markov)
# dans le paquet, pour que `libretto serve --generate` fonctionne après une
# installation par wheel — quand l'arborescence source `examples/` est absente.
# Le cœur `libretto` n'en dépend pas : ils ne sont importés qu'à la demande.
packages = ["libretto", "libretto._generators"]

[tool.setuptools.package-dir]
"libretto._generators" = "examples"
