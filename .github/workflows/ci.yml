name: CI

# Libretto est 100 % stdlib : aucune étape d'installation de dépendances.
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Un seul job macOS : on vérifie la portabilité, pas toute la matrice.
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests unitaires
        run: python -m unittest discover -s tests -v

      - name: Gate qualité (démo, e2e MIDI, calibration)
        run: bash scripts/check.sh
